<div class="toasts" aria-live="polite">
  @for (toast of notify.toasts(); track toast.id) {
    <div class="toast" [class]="'toast toast--' + toast.type" role="status">
      <span>{{ toast.message }}</span>
      <button type="button" aria-label="Dismiss" (click)="notify.dismiss(toast.id)">×</button>
    </div>
  }
</div>
